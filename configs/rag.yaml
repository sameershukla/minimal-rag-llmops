# Every knob that changes RAG quality lives here, so every change is a versioned diff.
# Bump `version` whenever you change anything below; eval results are saved per version.
version: v1

data:
  docs_dir: docs

chunking:
  max_tokens: 350        # max words per chunk (simple word count)
  overlap: 40            # words carried into the next chunk of the same section

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

vectordb:
  path: .chroma

retrieval:
  top_k: 10              # candidates pulled from the vector DB
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_top_n: 4        # chunks passed to the LLM after reranking

llm:
  model: claude-opus-5
  effort: low            # low | medium | high  (lower = faster, cheaper)
  max_tokens: 16000
  prompt_version: v1     # file in rag/generation/prompts/<version>.txt
